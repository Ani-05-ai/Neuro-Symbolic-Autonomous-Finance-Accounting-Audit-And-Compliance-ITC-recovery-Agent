events {}

http {
    upstream api_backend {
        server api:8000;
    }

    server {
        listen 80;
        listen [::]:80;

        location /api/ {
            proxy_pass http://api_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
        }
    }
}