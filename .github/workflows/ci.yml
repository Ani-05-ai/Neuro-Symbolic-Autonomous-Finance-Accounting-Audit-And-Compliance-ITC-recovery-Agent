name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: recoveritc
          POSTGRES_PASSWORD: recoveritc
          POSTGRES_DB: recoveritc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recoveritc -d recoveritc_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv and set Python
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run black --check .

      - name: Type check
        run: uv run mypy src backend tests

      - name: Test with coverage gate
        env:
          DATABASE_URL: postgresql+psycopg://recoveritc:recoveritc@localhost:5432/recoveritc_test
        run: uv run pytest --cov

      - name: Minimize uv cache
        run: uv cache prune --ci
