[project]
name = "itc-backend"
version = "0.1.0"

description = "ITC backend — invoice-to-cash recovery platform"
requires-python = ">=3.13"
dependencies = [
    "pydantic-settings>=2.14.2",
    "celery[redis]>=5.6.3",
    "fastapi>=0.138.0",
    "httpx2>=2.5.0",
    "pytest>=9.1.1",
    "uvicorn[standard]>=0.49.0",
     "httpx>=0.28.1",
]

[dependency-groups]
dev = [

    "black>=26.0.0",
    "mypy>=2.0.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.15.0",
]

# ---------------------------------------------------------------------------
# Ruff — fast linter + formatter (replaces flake8/isort in CI)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "ANN", # flake8-annotations  (type hints enforced)
    "PT",  # flake8-pytest-style
    "RUF", # Ruff-specific rules
]
ignore = [
    "ANN401", # allow Any — needed in logging/gateway internals
]

[tool.ruff.lint.per-file-ignores]
"itc/tests/*" = [
    "ANN",  # relax annotation enforcement in tests
    "S101", # allow assert statements in tests
]

[tool.ruff.lint.isort]
known-first-party = ["itc"]

# ---------------------------------------------------------------------------
# Black — opinionated formatter (used by pre-commit hook)
# ---------------------------------------------------------------------------
[tool.black]
line-length = 88
target-version = ["py313"]

# ---------------------------------------------------------------------------
# mypy — strict type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
# Pydantic plugin (add when pydantic-mypy is installed in M1+)
# plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Relax strict rules slightly for test files — inner classes,
# dynamically constructed mocks, etc. are hard to annotate fully.
module = "itc.tests.*"
disallow_untyped_defs = true
warn_return_any = false

# ---------------------------------------------------------------------------
# pytest + pytest-asyncio
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests/unit"]
asyncio_mode = "auto"
pythonpath = ["."]
