[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recoveritc"
version = "0.1.0"
description = "AI-powered GST reconciliation and ITC recovery system."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "recoveritc maintainers" }]
dependencies = []

[dependency-groups]
dev = [
    "black>=24.0",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
show_error_codes = true
warn_unreachable = true
mypy_path = "src"

[tool.pytest.ini_options]
addopts = [
    "--cov=src/recoveritc",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=85",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src/recoveritc"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
